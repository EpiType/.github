---
name: 🐛 Bug Report
description: Signaler un bug ou un problème
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport de bug !
        
  - type: textarea
    id: description
    attributes:
      label: Description du Bug
      description: Une description claire et concise du bug
      placeholder: Décrivez le bug...
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Les étapes pour reproduire le comportement
      placeholder: |
        1. Aller à '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous attendiez qu'il se passe
      placeholder: Décrivez le comportement attendu...
    validations:
      required: true
      
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Ajoutez des captures d'écran si applicable
      placeholder: Glissez-déposez vos images ici...
    validations:
      required: false
      
  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Autre
    validations:
      required: false
      
  - type: input
    id: version
    attributes:
      label: Version
      description: Quelle version utilisez-vous ?
      placeholder: ex. 1.0.0
    validations:
      required: false
      
  - type: textarea
    id: context
    attributes:
      label: Contexte supplémentaire
      description: Tout autre contexte pertinent
      placeholder: Ajoutez du contexte...
    validations:
      required: false
      
  - type: checkboxes
    id: terms
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié que ce bug n'a pas déjà été signalé
          required: true
        - label: J'ai fourni toutes les informations nécessaires
          required: true
